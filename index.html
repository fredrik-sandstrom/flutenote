<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flute Tuner & Metronome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Flute Tuner & Metronome</h1>
        <p style="text-align: center; margin-bottom: 20px;">
            <a href="test.html" style="color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 5px; font-size: 14px; display: inline-block;">
                🧪 Run Accuracy Tests
            </a>
        </p>

        <!-- Tuner Section -->
        <div class="section tuner-section">
            <h2>Tuner</h2>
            <button id="startTuner" class="btn btn-primary">Start Tuner</button>
            <button id="stopTuner" class="btn btn-secondary" style="display: none;">Stop Tuner</button>

            <div id="tunerDisplay" class="tuner-display">
                <div class="note-display">
                    <div id="noteText" class="note-text">--</div>
                    <div id="frequency" class="frequency">0 Hz</div>
                </div>

                <div class="tuner-meter">
                    <div class="meter-marks">
                        <span class="mark">-50</span>
                        <span class="mark">-25</span>
                        <span class="mark center">0</span>
                        <span class="mark">+25</span>
                        <span class="mark">+50</span>
                    </div>
                    <div class="meter-bar">
                        <div id="meterNeedle" class="meter-needle"></div>
                    </div>
                    <div id="centsDisplay" class="cents-display">0 cents</div>
                </div>

                <div class="status-indicator">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText">Tuner stopped</span>
                </div>
            </div>
        </div>

        <!-- Note Transcript Section -->
        <div class="section transcript-section">
            <h2>Practice Transcript</h2>
            <p style="color: #666; font-size: 0.9em; margin-bottom: 15px;">
                Watch your played notes scroll by like a piano roll
            </p>
            <div class="transcript-controls">
                <button id="clearTranscript" class="btn btn-secondary" style="padding: 8px 20px; font-size: 14px;">Clear History</button>
            </div>

            <div class="song-controls" style="margin-bottom: 15px; padding: 15px; background: white; border-radius: 8px;">
                <label for="songInput" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">
                    ABC Notation:
                    <span style="font-weight: normal; color: #666; font-size: 0.85em;">
                        (<a href="https://abcnotation.com/" target="_blank" style="color: #667eea;">Learn ABC notation</a>)
                    </span>
                </label>
                <textarea id="songInput" rows="4" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-family: monospace; font-size: 0.9em; resize: vertical;" placeholder="L:1/4&#10;Q:1/4=120&#10;K:C&#10;C D E F | G2 A2 | B2 c2 |"></textarea>
                <div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="playSong" class="btn btn-primary" style="padding: 8px 20px; font-size: 14px;">Play Song</button>
                    <button id="stopSong" class="btn btn-secondary" style="padding: 8px 20px; font-size: 14px; display: none;">Stop Song</button>
                    <button id="loadExample" class="btn" style="padding: 8px 20px; font-size: 14px; background: #6c757d; color: white;">Load Example (Twinkle Twinkle)</button>
                    <button id="transposeDown" class="btn" style="padding: 8px 20px; font-size: 14px; background: #17a2b8; color: white;">Transpose -8va</button>
                    <button id="transposeUp" class="btn" style="padding: 8px 20px; font-size: 14px; background: #17a2b8; color: white;">Transpose +8va</button>
                </div>
            </div>

            <div id="transcriptDisplay" class="transcript-display">
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: 600; color: #333; margin-right: 10px;">View:</label>
                    <button id="togglePianoRoll" class="btn" style="padding: 6px 16px; font-size: 13px; background: #667eea; color: white;">Piano Roll</button>
                    <button id="toggleSheetMusic" class="btn" style="padding: 6px 16px; font-size: 13px; background: #6c757d; color: white;">Sheet Music</button>
                </div>

                <div class="piano-roll-container" id="pianoRollView">
                    <div class="note-labels" id="noteLabels"></div>
                    <div class="scroll-container" id="scrollContainer">
                        <canvas id="pianoRollCanvas"></canvas>
                    </div>
                </div>

                <div class="sheet-music-container" id="sheetMusicView" style="display: none;">
                    <div class="scroll-container" style="height: 400px; overflow: hidden; position: relative; background: #f8f9fa; border-radius: 8px;">
                        <canvas id="sheetMusicCanvas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metronome Section -->
        <div class="section metronome-section">
            <h2>Metronome</h2>
            <div class="metronome-controls">
                <div class="tempo-control">
                    <label for="tempoSlider">Tempo: <span id="tempoDisplay">120</span> BPM</label>
                    <input type="range" id="tempoSlider" min="40" max="208" value="120" step="1">
                </div>

                <div class="beat-control">
                    <label for="beatsPerMeasure">Beats per measure:</label>
                    <select id="beatsPerMeasure">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>

                <button id="startMetronome" class="btn btn-primary">Start Metronome</button>
                <button id="stopMetronome" class="btn btn-secondary" style="display: none;">Stop Metronome</button>
            </div>

            <div class="metronome-display">
                <div id="beatIndicator" class="beat-indicator">
                    <div class="beat-dots"></div>
                </div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #999; font-size: 0.85em;">
            Version 1.13.0 - Pitchy Library
        </div>
    </div>

    <script src="https://unpkg.com/pitchy@3/dist/pitchy.umd.js"></script>
    <script src="tuner.js"></script>
    <script src="metronome.js"></script>
    <script src="app.js"></script>
</body>
</html>
